name: Docker installer acceptance
description: Run one Compose acceptance service and retain diagnostics on failure
inputs:
  service:
    description: Allowlisted Compose service
    required: true
  artifact:
    description: Unique artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Run acceptance service
      shell: bash
      env:
        E2E_SERVICE: ${{ inputs.service }}
      run: ./scripts/ci/e2e.sh "$E2E_SERVICE"
    - name: Publish performance budgets
      if: always()
      shell: bash
      run: |
        find artifacts -type f -name performance.md -print0 |
          sort -z | xargs -0 -r cat >>"$GITHUB_STEP_SUMMARY"
    - name: Upload acceptance diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 14
    - name: Upload performance sample
      if: success() && inputs.service != 'recovery' && inputs.service != 'failure-resume'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: performance-sample-${{ inputs.artifact }}
        path: artifacts/**/performance.json
        if-no-files-found: error
        retention-days: 90
