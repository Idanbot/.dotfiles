name: Version Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-audit
  cancel-in-progress: false

jobs:
  report:
    name: Report available version and checksum updates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check latest versions and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPGRADE_REPORT: ${{ runner.temp }}/dotfiles-upgrade-report.md
        run: |
          ./scripts/update-packages.sh --check --report "$UPGRADE_REPORT"
          cat "$UPGRADE_REPORT" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload upgrade report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-version-checksum-report
          path: ${{ runner.temp }}/dotfiles-upgrade-report.md
          retention-days: 30
