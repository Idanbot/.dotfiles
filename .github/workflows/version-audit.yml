name: Version Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-audit
  cancel-in-progress: false

jobs:
  report:
    name: Report versions, checksums, and pinned-version CVEs
    permissions:
      contents: read
      issues: write  # Refresh one standing advisory issue, never one issue per tool.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare cached audit dependencies
        uses: ./.github/actions/audit-python
      - name: Check latest versions and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPGRADE_REPORT: ${{ runner.temp }}/dotfiles-upgrade-report.md
        run: |
          export PATH="$RUNNER_TEMP/audit-venv/bin:$PATH"
          ./scripts/ci/maintenance-audit.sh weekly "$UPGRADE_REPORT"
      - name: Upload upgrade report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-version-checksum-cve-report
          path: ${{ runner.temp }}/dotfiles-upgrade-report.md
          retention-days: 30
