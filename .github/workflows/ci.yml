name: CI - Reliable Bootstrap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 0"
  workflow_dispatch:
    inputs:
      run_heavy_e2e:
        description: Run developer, agent, cloud, full WSL-simulated, and full-native two-pass installs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Static, security, behavior, and selectors
    uses: ./.github/workflows/ci-checks.yml

  live:
    name: Gated release and installer acceptance
    needs: [checks]
    uses: ./.github/workflows/ci-live.yml
    permissions:
      contents: read
      actions: read  # read rolling performance artifacts; never delete history
    with:
      heavy: >-
        ${{ github.event_name == 'schedule' || inputs.run_heavy_e2e == true ||
            (github.event_name == 'pull_request' && github.head_ref == 'automation/grouped-tool-upgrades') }}

  result:
    name: CI Result
    if: always()
    needs: [checks, live]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject failed or unexpectedly skipped required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/result.py --required checks live
