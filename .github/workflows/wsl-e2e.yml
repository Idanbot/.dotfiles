name: Real WSL E2E (Manual, Private Runner)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-wsl-e2e
  cancel-in-progress: false

jobs:
  wsl:
    name: Bootstrap in disposable real WSL2 (manual only)
    # Dedicated private Windows runner only. Set WSL_E2E_ROOTFS to a local
    # Ubuntu 24.04 rootfs tar; never use an existing/default personal distro.
    runs-on: [self-hosted, windows, x64, wsl-ubuntu-24.04]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and bootstrap inside real WSL
        shell: pwsh
        env:
          CHECKOUT_WORKSPACE: ${{ github.workspace }}
          DOTFILES_WSL_ROOTFS: ${{ vars.WSL_E2E_ROOTFS }}
        run: ./tests/e2e/test-wsl.ps1 -Workspace "$env:CHECKOUT_WORKSPACE" -Rootfs "$env:DOTFILES_WSL_ROOTFS"
      - name: Upload WSL logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-wsl-e2e
          path: artifacts/wsl/
          if-no-files-found: warn
          retention-days: 30
