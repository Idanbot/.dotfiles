name: CI Outcome Classification

on:  # zizmor: ignore[dangerous-triggers] only trusted default-branch code executes
  workflow_run:
    workflows: ["CI - Reliable Bootstrap"]
    types: [completed]

permissions: {}

concurrency:
  group: ci-outcome-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  classify:
    name: Classify completed CI run
    permissions:
      actions: read  # fetch the completed run's job conclusions and logs
      checks: write  # zizmor: ignore[excessive-permissions] publish the diagnostic check
      contents: read  # checkout the trusted classifier from the default branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Fetch jobs and job-scoped infrastructure annotations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            | jq '{jobs: [.[].jobs[]]}' >"$RUNNER_TEMP/jobs.json"
          printf '{}\n' >"$RUNNER_TEMP/annotations.json"
          if [[ "$RUN_CONCLUSION" != success ]]; then
            while read -r job_id check_id; do
              if gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/check-runs/$check_id/annotations?per_page=100" \
                | jq 'add' >"$RUNNER_TEMP/job-annotations.json"; then
                jq --arg id "$job_id" --slurpfile entries "$RUNNER_TEMP/job-annotations.json" \
                  '.[$id] = $entries[0]' "$RUNNER_TEMP/annotations.json" \
                  >"$RUNNER_TEMP/annotations-next.json"
                mv "$RUNNER_TEMP/annotations-next.json" "$RUNNER_TEMP/annotations.json"
              else
                echo '::warning::Job annotations unavailable; failures will remain actionable.'
              fi
            done < <(jq -r '
              .jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or
                .conclusion == "action_required" or .conclusion == "startup_failure" or
                .conclusion == "cancelled" or .conclusion == "stale") |
              select(.id | type == "number") |
              select(.check_run_url | type == "string") |
              [.id, (.check_run_url | capture("/check-runs/(?<id>[0-9]+)$").id)] | @tsv
            ' "$RUNNER_TEMP/jobs.json")
          fi
      - name: Classify outcome
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          ./scripts/classify-ci-run.sh \
            --jobs "$RUNNER_TEMP/jobs.json" \
            --conclusion "$RUN_CONCLUSION" \
            --annotations "$RUNNER_TEMP/annotations.json" \
            --run-url "$RUN_URL" >"$RUNNER_TEMP/classification.json"
          jq -r '"## " + .title + "\n\n" + .summary' \
            "$RUNNER_TEMP/classification.json" >>"$GITHUB_STEP_SUMMARY"
      - name: Publish classification check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || 1 }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: ./scripts/publish-ci-classification.sh "$RUNNER_TEMP/classification.json"
