name: Gated Live Acceptance

on:
  workflow_call:
    inputs:
      heavy:
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  github-release-tools:
    name: Verified Release Asset Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download validators built for this SHA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-image-${{ github.sha }}
          path: ${{ runner.temp }}/ci-image
      - name: Load shared validators
        run: ./scripts/ci/validator-image.sh load "$RUNNER_TEMP/ci-image"
      - name: Verify live release paths in Docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTFILES_CI_IMAGE: dotfiles-ci-tests
          DOTFILES_CI_SKIP_BUILD: "true"
        run: ./scripts/ci/docker-suite.sh release

  base-e2e:
    name: base-e2e (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [base-native]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run acceptance and retain reports
        uses: ./.github/actions/e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          service: ${{ matrix.service }}
          artifact: base-e2e-${{ matrix.service }}

  recovery-e2e:
    name: recovery-e2e (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [recovery]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run acceptance and retain reports
        uses: ./.github/actions/e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          service: ${{ matrix.service }}
          artifact: recovery-e2e-${{ matrix.service }}

  extended-e2e:
    name: Extended ${{ matrix.service }} E2E
    if: inputs.heavy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        service: [base-wsl-simulated, failure-resume]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run acceptance and retain reports
        uses: ./.github/actions/e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          service: ${{ matrix.service }}
          artifact: extended-e2e-${{ matrix.service }}

  heavy-e2e:
    name: Live ${{ matrix.service }} E2E
    if: inputs.heavy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        service: [full-native, full, developer, agent, cloud]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run acceptance and retain reports
        uses: ./.github/actions/e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          service: ${{ matrix.service }}
          artifact: heavy-e2e-${{ matrix.service }}

  performance-history:
    name: Rolling Performance History
    if: >-
      always() &&
      inputs.heavy &&
      needs.base-e2e.result == 'success' &&
      needs.extended-e2e.result == 'success' &&
      needs.heavy-e2e.result == 'success' &&
      github.event_name != 'pull_request'
    needs: [base-e2e, extended-e2e, heavy-e2e]
    permissions:
      actions: read  # download this run's and prior performance artifacts
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download prior history and current samples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          input="$RUNNER_TEMP/performance-inputs"
          mkdir -p "$input/prior" "$input/current"

          prior_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=performance-history&per_page=10" \
              --jq '[.artifacts[] | select(.expired == false)][0].id // empty'
          )"
          if [[ -n "$prior_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$prior_id/zip" \
              >"$RUNNER_TEMP/prior-history.zip"
            unzip -q "$RUNNER_TEMP/prior-history.zip" -d "$input/prior"
          fi

          mkdir -p "$input/recent"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[
              .artifacts[] |
              select(.expired == false and (.name | startswith("performance-sample-"))) |
              [.id, .name]
            ][0:20][] | @tsv' |
            while IFS=$'\t' read -r artifact_id artifact_name; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                >"$RUNNER_TEMP/recent-$artifact_id.zip"
              mkdir -p "$input/recent/$artifact_id-$artifact_name"
              unzip -q "$RUNNER_TEMP/recent-$artifact_id.zip" \
                -d "$input/recent/$artifact_id-$artifact_name"
            done

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("performance-sample-")) | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r artifact_id artifact_name; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                >"$RUNNER_TEMP/$artifact_name.zip"
              mkdir -p "$input/current/$artifact_name"
              unzip -q "$RUNNER_TEMP/$artifact_name.zip" -d "$input/current/$artifact_name"
            done
      - name: Build trend dashboard
        run: |
          ./scripts/performance-history.sh \
            "$RUNNER_TEMP/performance-inputs" \
            "$RUNNER_TEMP/performance-dashboard"
          cat "$RUNNER_TEMP/performance-dashboard/performance-history.md" \
            >>"$GITHUB_STEP_SUMMARY"
      - name: Upload rolling performance history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-history
          path: ${{ runner.temp }}/performance-dashboard/
          if-no-files-found: error
          retention-days: 90

  result:
    name: Live Acceptance Result
    if: always()
    needs: [github-release-tools, base-e2e, recovery-e2e, extended-e2e, heavy-e2e, performance-history]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all required live results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          HEAVY_REQUIRED: ${{ inputs.heavy }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          optional=()
          [[ "$HEAVY_REQUIRED" == true ]] || optional+=(heavy-e2e extended-e2e)
          [[ "$HEAVY_REQUIRED" == true && "$EVENT_NAME" != pull_request ]] || optional+=(performance-history)
          python3 scripts/ci/result.py \
            --required github-release-tools base-e2e recovery-e2e extended-e2e heavy-e2e performance-history \
            --optional "${optional[@]}"
