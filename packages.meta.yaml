# Installation ownership and integrity policy for packages.yaml.

bootstrap:
  chezmoi:
    source: apt_or_github
    owner: bootstrap
    repo: twpayne/chezmoi
    tag_template: "v{version}"
    asset_template: "chezmoi_{version}_linux_{arch}.tar.gz"
    arch_amd64: amd64
    arch_arm64: arm64
