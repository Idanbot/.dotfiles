# Agent workspace registry. Authentication and agent state are never managed.
workspace:
  agents:
    - codex
    - antigravity
    - claude
    - opencode
    - omp

agents:
  codex:
    command: codex
    install: openai-standalone
    required: true
  antigravity:
    command: agy
    install: google-standalone
    required: true
  claude:
    command: claude
    install: npm
    required: true
  opencode:
    command: opencode
    install: npm
    required: true
  omp:
    command: omp
    install: github-standalone
    required: true
